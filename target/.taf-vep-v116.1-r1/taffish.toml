[package]
name = "vep"
kind = "tool"
version = "116.1"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/vep"

[command]
name = "taf-vep"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/vep:116.1-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["variant-annotation", "genomics", "vcf", "variant-effect", "ensembl"]
keywords = ["VEP", "Ensembl VEP", "Variant Effect Predictor", "variant annotation", "VCF", "CSQ", "consequence", "Haplosaurus", "Variant Recoder", "filter_vep"]
description = "Ensembl Variant Effect Predictor (VEP) 116.1 runtime for annotating sequence variants and running related VEP helper tools."

[upstream]
name = "Ensembl Variant Effect Predictor (VEP)"
type = "github"
repo = "Ensembl/ensembl-vep"
homepage = "https://www.ensembl.org/info/docs/tools/vep/index.html"
release_url = "https://github.com/Ensembl/ensembl-vep/tree/release/116.1"
downloads = "docker.io/ensemblorg/ensembl-vep:release_116.1@sha256:6972667883d89b9fa55e5cbe94f1b4c259ebc6bbd178310cef78f617e055eb75; https://github.com/Ensembl/ensembl-vep/archive/refs/tags/release/116.1.tar.gz"
version = "116.1"
license = "Apache-2.0"
citation = "McLaren W, Gil L, Hunt SE, Riat HS, Ritchie GRS, Thormann A, Flicek P, Cunningham F. The Ensembl Variant Effect Predictor. Genome Biology. 2016;17:122."
doi = "10.1186/s13059-016-0974-4"
pmid = "27268795"
watch = "tags"
strip_prefix = "release/"

[smoke]
backend = "docker"
timeout = 240
exist = ["vep", "filter_vep", "haplo", "variant_recoder", "INSTALL.pl", "perl", "curl", "bgzip", "tabix", "htsfile", "genesplicer", "python", "python2"]
test = ["vep --help 2>&1 | grep -F \"ensembl-vep          : 116.1\" >/dev/null && vep --help 2>&1 | grep -F \"ENSEMBL VARIANT EFFECT PREDICTOR\" >/dev/null && haplo --help 2>&1 | grep -F \"HAPLOSAURUS\" >/dev/null && variant_recoder --help 2>&1 | grep -F \"VARIANT RECODER\" >/dev/null", "INSTALL.pl --help 2>&1 | grep -F -- \"--CACHE_VERSION    Set data\" >/dev/null && INSTALL.pl --help 2>&1 | grep -F \"default = 116\" >/dev/null && filter_vep --help 2>&1 | grep -F \"consequence data\" >/dev/null", "perl -MBio::EnsEMBL::VEP::Constants -e 'print join(qq(.), $Bio::EnsEMBL::VEP::Constants::VEP_VERSION, $Bio::EnsEMBL::VEP::Constants::VEP_SUB_VERSION), qq(\\n)' | grep -Fx \"116.1\" >/dev/null && perl -MJSON -e 'print qq(JSON ok\\n)' | grep -Fx \"JSON ok\" >/dev/null && perl -MBio::DB::HTS -e 'print qq(HTS ok\\n)' | grep -Fx \"HTS ok\" >/dev/null && perl -MBio::DB::BigFile -e 'print qq(BigFile ok\\n)' | grep -Fx \"BigFile ok\" >/dev/null && tabix --version 2>&1 | grep -F \"htslib\" >/dev/null && bgzip --version 2>&1 | grep -F \"htslib\" >/dev/null && test -s /plugins/CADD.pm && test -s /plugins/AlphaMissense.pm", "tmp=/tmp/taf-vep-filter-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; cp /opt/taffish/share/vep/smoke/filter-input.vcf \"$tmp/filter-input.vcf\"; filter_vep --format vcf --filter \"Consequence is missense_variant\" -i \"$tmp/filter-input.vcf\" -o \"$tmp/out.vcf\" --force_overwrite; grep -F \"missense_variant\" \"$tmp/out.vcf\" >/dev/null; if grep -F \"synonymous_variant\" \"$tmp/out.vcf\"; then exit 1; fi; rm -rf \"$tmp\"", "tmp=/tmp/taf-vep-gff-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; cp /opt/taffish/share/vep/smoke/ref.fa /opt/taffish/share/vep/smoke/genes.gff3.gz /opt/taffish/share/vep/smoke/genes.gff3.gz.tbi /opt/taffish/share/vep/smoke/input.vcf \"$tmp\"/; vep --gff \"$tmp/genes.gff3.gz\" --fasta \"$tmp/ref.fa\" --format vcf --vcf --force_overwrite --no_stats --species homo_sapiens -i \"$tmp/input.vcf\" -o \"$tmp/out.vcf\" > \"$tmp/run.log\" 2>&1; grep -F \"##VEP=\\\"v116.1\\\"\" \"$tmp/out.vcf\" >/dev/null && grep -F \"missense_variant\" \"$tmp/out.vcf\" >/dev/null && grep -F \"GENE1\" \"$tmp/out.vcf\" >/dev/null; rm -rf \"$tmp\""]
